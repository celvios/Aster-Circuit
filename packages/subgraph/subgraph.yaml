specVersion: 0.0.5
schema:
  file: ./schema.graphql

dataSources:
  # ── APEXVault ──────────────────────────────────────────────────────────────
  - kind: ethereum
    name: APEXVault
    network: bsc
    source:
      # Replace with your deployed vault address after BSC deploy
      address: "0x0000000000000000000000000000000000000000"
      abi: APEXVault
      # Replace with the block your vault was deployed at
      startBlock: 40000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - APEXVault
        - User
        - Deposit
        - Withdrawal
        - DailySnapshot
        - Protocol
      abis:
        - name: APEXVault
          file: ./abis/APEXVault.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: BrainUpdated(indexed address)
          handler: handleBrainUpdated
        - event: Synced(uint256[4],uint256)
          handler: handleSynced
      file: ./src/vault.ts

  # ── APEXBrain ──────────────────────────────────────────────────────────────
  - kind: ethereum
    name: APEXBrain
    network: bsc
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: APEXBrain
      startBlock: 40000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - WeightSnapshot
        - DailySnapshot
      abis:
        - name: APEXBrain
          file: ./abis/APEXBrain.json
      eventHandlers:
        - event: WeightsUpdated(uint256[4],uint256[4],uint256[3])
          handler: handleWeightsUpdated
      file: ./src/brain.ts

  # ── APEXCompounder ─────────────────────────────────────────────────────────
  - kind: ethereum
    name: APEXCompounder
    network: bsc
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: APEXCompounder
      startBlock: 40000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - HarvestEvent
        - Protocol
        - DailySnapshot
      abis:
        - name: APEXCompounder
          file: ./abis/APEXCompounder.json
      eventHandlers:
        - event: Compounded(uint256,uint256,uint256[4])
          handler: handleCompounded
      file: ./src/compounder.ts
