specVersion: 0.0.5
schema:
  file: ./schema.graphql

dataSources:
  # ── APEXVault ──────────────────────────────────────────────────────────────
  - kind: ethereum
    name: APEXVault
    network: chapel
    source:
      address: "0x7073428b61062c96A7Cc9c09dbdBf6B39b489Cd7"
      abi: APEXVault
      startBlock: 44800000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - APEXVault
        - User
        - Deposit
        - Withdrawal
        - DailySnapshot
        - Protocol
      abis:
        - name: APEXVault
          file: ./abis/APEXVault.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: BrainUpdated(address)
          handler: handleBrainUpdated
        - event: Synced(uint256,uint256)
          handler: handleSynced
      file: ./src/vault.ts

  # ── APEXBrain ──────────────────────────────────────────────────────────────
  - kind: ethereum
    name: APEXBrain
    network: chapel
    source:
      address: "0xA8d94E28235Cc53DD5C284ba09a3a3339BD79584"
      abi: APEXBrain
      startBlock: 44800000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - WeightSnapshot
        - DailySnapshot
      abis:
        - name: APEXBrain
          file: ./abis/APEXBrain.json
      eventHandlers:
        - event: WeightsUpdated((uint256,uint256,uint256,uint256),(uint256,uint256,uint256,uint256),(uint256,uint256,uint256))
          handler: handleWeightsUpdated
      file: ./src/brain.ts

  # ── APEXCompounder ─────────────────────────────────────────────────────────
  - kind: ethereum
    name: APEXCompounder
    network: chapel
    source:
      address: "0x25F6369e61Ab3Cec867E8EE5501D4c3b08A9fA84"
      abi: APEXCompounder
      startBlock: 44800000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - HarvestEvent
        - Protocol
        - DailySnapshot
      abis:
        - name: APEXCompounder
          file: ./abis/APEXCompounder.json
      eventHandlers:
        - event: Compounded(uint256,uint256,uint256[4])
          handler: handleCompounded
      file: ./src/compounder.ts


